name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  SERVICE_NAME: user-service

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}

  release:
    needs: image
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
    with:
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
