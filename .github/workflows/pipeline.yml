name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  SERVICE_NAME: user-service

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}

  deploy-qa:
    needs: image
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: ${{ github.repository }}-deploy-qa
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"

  deploy-prod:
    needs: [image, deploy-qa]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: ${{ github.repository }}-deploy-prod
      cancel-in-progress: true
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: curl -fsS -X POST "${DEPLOY_HOOK}&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"
